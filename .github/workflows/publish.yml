name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Extract version from tag
      id: get_version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    # The nuspec version and AssemblyFileVersion are maintained in different files, and they
    # drifted once already: 3.4.0 shipped a DLL stamped 3.3.0.0, so a support call would read
    # the wrong version off the binary. Fail loudly rather than publish a mislabelled package.
    - name: Check AssemblyFileVersion matches the tag
      shell: pwsh
      run: |
        $tag = "${{ steps.get_version.outputs.VERSION }}"
        $info = Get-ChildItem -Recurse -Filter AssemblyInfo.cs |
                Where-Object { $_.FullName -notmatch "\\(obj|bin|packages|samples|Test)\\" } |
                Select-Object -First 1
        if (-not $info) { throw "AssemblyInfo.cs not found" }
        $text = Get-Content $info.FullName -Raw
        if ($text -notmatch 'AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+)') {
          throw "AssemblyFileVersion not found in $($info.FullName)"
        }
        $file = $Matches[1]
        if ($file -ne $tag) {
          throw "Version mismatch: tag/nuspec is $tag but AssemblyFileVersion is $file ($($info.Name))"
        }
        echo "AssemblyFileVersion $file matches $tag"
    - name: Check if NuGet package already exists
      id: check_nuget
      shell: pwsh
      run: |
        $packageId = "LicenseManagement.EndUser.Wpf"
        $version = "${{ steps.get_version.outputs.VERSION }}"
        $url = "https://api.nuget.org/v3-flatcontainer/$($packageId.ToLower())/index.json"
        try {
          $response = Invoke-RestMethod -Uri $url -ErrorAction Stop
          if ($response.versions -contains $version) {
            echo "Package $packageId version $version already exists on NuGet.org"
            echo "EXISTS=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "Package $packageId version $version does not exist on NuGet.org"
            echo "EXISTS=false" >> $env:GITHUB_OUTPUT
          }
        } catch {
          echo "Package $packageId not found on NuGet.org (new package)"
          echo "EXISTS=false" >> $env:GITHUB_OUTPUT
        }

    # Read the EndUser version from the csproj rather than hard-coding it here. This step
    # used to say 3.1.1 while the csproj and nuspec said 3.3.0, which would have failed the
    # pack (the nuspec bundles packages\LicenseManagement.EndUser.<version>\...). Deriving it
    # from the single source of truth means the two can never drift again.
    - name: Resolve LicenseManagement.EndUser version
      if: steps.check_nuget.outputs.EXISTS != 'true'
      id: enduser
      shell: pwsh
      run: |
        $csproj = Get-Content LicenseManagement.EndUser.Wpf.csproj -Raw
        if ($csproj -notmatch '<LicenseEndUserVersion>([^<]+)</LicenseEndUserVersion>') {
          throw "LicenseEndUserVersion not found in LicenseManagement.EndUser.Wpf.csproj"
        }
        $enduser = $Matches[1]
        $nuspec = Get-Content nugetSpec.nuspec -Raw
        if ($nuspec -notmatch '<dependency id="LicenseManagement.EndUser" version="([^"]+)"') {
          throw "LicenseManagement.EndUser dependency not found in nugetSpec.nuspec"
        }
        if ($Matches[1] -ne $enduser) {
          throw "Version drift: csproj says $enduser, nuspec says $($Matches[1])"
        }
        echo "Using LicenseManagement.EndUser $enduser"
        echo "VERSION=$enduser" >> $env:GITHUB_OUTPUT

    - name: Install LicenseManagement.EndUser from NuGet
      if: steps.check_nuget.outputs.EXISTS != 'true'
      shell: pwsh
      run: |
        # Install the EndUser package first (required for build). Must match the version the
        # net481 assembly is built against AND the one bundled in the nuspec (see below).
        nuget install LicenseManagement.EndUser -Version ${{ steps.enduser.outputs.VERSION }} -OutputDirectory packages

    - name: Restore NuGet packages
      if: steps.check_nuget.outputs.EXISTS != 'true'
      run: nuget restore LicenseManagement.EndUser.Wpf.csproj -PackagesDirectory packages

    - name: Install bundled packages for nuspec
      if: steps.check_nuget.outputs.EXISTS != 'true'
      shell: pwsh
      run: |
        # Install additional packages that are bundled in the nuspec
        nuget install Hymma.HttpClientFactory -Version 1.0.8 -OutputDirectory packages

    - name: Build Release
      if: steps.check_nuget.outputs.EXISTS != 'true'
      run: msbuild LicenseManagement.EndUser.Wpf.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:LicenseEndUserVersion=${{ steps.enduser.outputs.VERSION }}

    # Build the sibling net8.0-windows assembly (links the same XAML + sources). Its
    # output is packed into lib/net8.0-windows7.0 alongside the unchanged net481 assembly.
    - name: Build Release (net8.0-windows)
      if: steps.check_nuget.outputs.EXISTS != 'true'
      run: dotnet build net8/LicenseManagement.EndUser.Wpf.Net8.csproj -c Release

    - name: Update nuspec version
      if: steps.check_nuget.outputs.EXISTS != 'true'
      shell: pwsh
      run: |
        $nuspec = Get-Content nugetSpec.nuspec -Raw
        $nuspec = $nuspec -replace '<version>.*</version>', "<version>${{ steps.get_version.outputs.VERSION }}</version>"
        Set-Content nugetSpec.nuspec $nuspec

    - name: Pack NuGet package
      if: steps.check_nuget.outputs.EXISTS != 'true'
      run: nuget pack nugetSpec.nuspec -OutputDirectory nupkg

    - name: Push to NuGet
      if: steps.check_nuget.outputs.EXISTS != 'true'
      shell: pwsh
      run: |
        Get-ChildItem nupkg/*.nupkg | ForEach-Object { nuget push $_.FullName -ApiKey ${{ secrets.NUGET_API_KEY }} -Source https://api.nuget.org/v3/index.json -SkipDuplicate }

    - name: Extract changelog for this version
      id: changelog
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}"
        $changelog = Get-Content CHANGELOG.md -Raw

        # Extract the section for this version
        $pattern = "(?s)## \[$version\].*?(?=## \[|$)"
        if ($changelog -match $pattern) {
          $notes = $Matches[0].Trim()
          # Escape for GitHub Actions output
          $notes = $notes -replace '%', '%25'
          $notes = $notes -replace "`n", '%0A'
          $notes = $notes -replace "`r", '%0D'
          echo "NOTES=$notes" >> $env:GITHUB_OUTPUT
        } else {
          echo "NOTES=Release version $version" >> $env:GITHUB_OUTPUT
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: v${{ steps.get_version.outputs.VERSION }}
        body: |
          ${{ steps.changelog.outputs.NOTES }}

          ## NuGet Package

          Install via NuGet:
          ```
          Install-Package LicenseManagement.EndUser.Wpf -Version ${{ steps.get_version.outputs.VERSION }}
          ```

          Or via .NET CLI:
          ```
          dotnet add package LicenseManagement.EndUser.Wpf --version ${{ steps.get_version.outputs.VERSION }}
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
